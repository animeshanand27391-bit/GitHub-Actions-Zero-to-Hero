name: Python Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4        # ← upgraded from v3 to v4

      - name: Install dependencies
        run: pip3 install pytest

      - name: Run tests
        run: |
          cd src
          python3 -m pytest addition.py